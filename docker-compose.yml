version: '3.8'

services:
  # Flask API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chai-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    volumes:
      - ./suppliers.csv:/app/suppliers.csv
      - ./global_events.csv:/app/global_events.csv
    command: python api.py
    restart: unless-stopped
    networks:
      - chai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chai-dashboard
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    volumes:
      - ./suppliers.csv:/app/suppliers.csv
      - ./global_events.csv:/app/global_events.csv
    command: streamlit run dashboard.py
    restart: unless-stopped
    networks:
      - chai-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  chai-network:
    driver: bridge

volumes:
  data:
    driver: local
